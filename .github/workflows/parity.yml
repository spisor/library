name: Parity

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  parity:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: cmake
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
      cmake_configure: '-S . -B build -DCMAKE_BUILD_TYPE=Release'
      cmake_build: '--build build --config Release --target parity_test'
      cmake_test: 'ctest --test-dir build --output-on-failure -C Release -R "^parity_test$"'
