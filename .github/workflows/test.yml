name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: cmake
      runners: '["windows-latest"]'
      cmake_configure: '-S . -B build'
      cmake_build: '--build build --config Debug'
      cmake_test: 'ctest --test-dir build --output-on-failure -C Debug -j $(getconf _NPROCESSORS_ONLN)'
  sanitized:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: cmake
      runners: '["ubuntu-latest","macos-latest"]'
      cmake_configure: '-S . -B build -DCMAKE_BUILD_TYPE=Debug -DSPISOR_SANITIZE=ON'
      cmake_build: '--build build --config Debug'
      cmake_test: 'ctest --test-dir build --output-on-failure -C Debug -j $(getconf _NPROCESSORS_ONLN)'
  release:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: 'cmake node gradle'
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
      node_version: '24'
      node_install: 'node --version'
      node_build: ''
      node_test: 'node --version'
      java_version: '25'
      gradle_root: 'siblings/java'
      gradle_test: ''
      cmake_configure: '-S . -B build -DCMAKE_BUILD_TYPE=Release'
      cmake_build: '--build build --config Release'
      cmake_test: >-
        ctest --test-dir build --output-on-failure -C Release -j $(getconf _NPROCESSORS_ONLN)
        && ctest --test-dir build -C Release -V -R "_cost$"
